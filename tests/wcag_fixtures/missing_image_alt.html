<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Missing Image Alt - WCAG 1.1.1 Fixture</title>
</head>
<body>
    <main>
        <h1>Product Page</h1>
        <!-- VIOLATION: img element with no alt attribute — violates WCAG 1.1.1 -->
        <img src="product-photo.jpg">
        <!-- Control: decorative image with empty alt is acceptable -->
        <img src="divider.png" alt="">
    </main>
</body>
</html>
