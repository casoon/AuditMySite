<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Restrictive viewport meta corpus case</title>
</head>
<body>
    <main>
        <h1>Page with a zoom-disabling viewport meta tag</h1>
        <p>The viewport meta tag above sets user-scalable=no.</p>
    </main>
</body>
</html>
