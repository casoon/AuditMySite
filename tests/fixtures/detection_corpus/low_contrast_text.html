<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Low contrast text corpus case</title>
</head>
<body>
    <main>
        <h1>Low contrast body text</h1>
        <p style="color: #aaaaaa; background-color: #ffffff;">
            This paragraph uses light gray text on a white background, well below
            the 4.5:1 contrast ratio required for normal-size body text.
        </p>
    </main>
</body>
</html>
