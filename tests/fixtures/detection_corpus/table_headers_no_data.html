<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Table headers without data cells corpus case</title>
</head>
<body>
    <main>
        <h1>Table with headers but no data rows</h1>
        <table aria-label="Empty results">
            <thead>
                <tr><th>Name</th><th>Score</th></tr>
            </thead>
            <tbody>
                <tr><th>No results</th><th>—</th></tr>
            </tbody>
        </table>
    </main>
</body>
</html>
